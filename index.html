body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#1a1a1a;line-height:1.6}

.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.bar-list{background:#fff;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden}
.bar-row{display:flex;align-items:center;padding:6px 16px;gap:10px;border-bottom:1px solid #f0f0f0;position:relative;transition:background .12s}
.bar-row:last-child{border-bottom:none}
.bar-row:hover{background:#f5f8ff}
.bar-row:hover .tooltip{display:block}
.rank{width:28px;font-size:12px;color:#999;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.repo-name{width:240px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.repo-name a{color:#185FA5;text-decoration:none}
.repo-name a:hover{text-decoration:underline}
.bar-track{flex:1;height:22px;background:#f5f5f5;border-radius:4px;overflow:hidden;position:relative;min-width:60px}
.bar-fill{height:100%;border-radius:4px;transition:width .3s ease}

.stars-cell a:hover{color:#378ADD}
.tooltip{display:none;position:absolute;z-index:100;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;background:#1a1a1a;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.5;width:340px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.tooltip::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:#1a1a1a}
.tooltip-desc{display:block;margin-bottom:6px;color:#ddd}
.tooltip-meta{display:flex;gap:12px;font-size:11px;color:#aaa}
.tooltip-meta span{display:flex;align-items:center;gap:3px}
.no-results{padding:40px;text-align:center;color:#999;font-size:14px}
.section-header{font-size:14px;font-weight:600;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid #e8e8e8}

var maxStars = 166839;
var activeFilter = 'all';
var searchTerm = '';

function fmt(n) {
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k';
  return n.toString();
}

function barWidth(stars) {
  return Math.max(2, (Math.log10(stars + 1) / Math.log10(maxStars + 1)) * 100);
}

function shortName(full) {
  var parts = full.split('/');
  return parts[1] || full;
}

function buildBarRow(repo, rank) {
  var color = CAT_COLORS[repo.cat];
  var w = barWidth(repo.stars);
  var medals = ['&#129351;', '&#129352;', '&#129353;'];
  var rankHtml = rank <= 3 ? '<span class="medal">' + medals[rank - 1] + '</span>' : '';
  var url = 'https://github.com/' + repo.name;

  var row = document.createElement('div');
  row.className = 'bar-row';
  row.setAttribute('data-cat', repo.cat);
  row.setAttribute('data-search', (repo.name + ' ' + repo.desc).toLowerCase());

  row.innerHTML =
    '<span class="rank">' + rankHtml + (rank > 3 ? rank : '') + '</span>' +
    '<span class="repo-name"><a href="' + url + '" target="_blank">' + shortName(repo.name) + '</a></span>' +
    '<div class="bar-track">' +
      '<div class="bar-fill" style="width:' + w + '%;background:' + color + '"></div>' +
    '</div>' +
    '<span class="stars-cell"><a href="' + url + '/stargazers" target="_blank">' + fmt(repo.stars) + '</a></span>' +
    '<div class="tooltip">' +
      '<span class="tooltip-desc">' + repo.desc + '</span>' +
      '<div class="tooltip-meta">' +
        '<span style="color:' + color + '">&#9632; ' + CAT_LABELS[repo.cat] + '</span>' +
        '<span>&#9733; ' + repo.stars.toLocaleString() + '</span>' +
        '<span>&#9748; ' + repo.forks.toLocaleString() + ' forks</span>' +
        '<span>&#128279; ' + repo.name + '</span>' +
      '</div>' +
    '</div>';

  return row;
}

function render() {
  var top10List = document.getElementById('top10-list');
  var allList = document.getElementById('all-list');
  top10List.innerHTML = '';
  allList.innerHTML = '';

  var filtered = REPOS.filter(function(r) {
    var catOk = activeFilter === 'all' || r.cat === activeFilter;
    var searchOk = !searchTerm || (r.name + ' ' + r.desc).toLowerCase().indexOf(searchTerm) !== -1;
    return catOk && searchOk;
  });

  if (filtered.length === 0) {
    allList.innerHTML = '<div class="no-results">No repositories match your filter.</div>';
    return;
  }

  var top10 = filtered.slice(0, 10);
  var rest = filtered.slice(10);

  top10.forEach(function(r, i) {
    top10List.appendChild(buildBarRow(r, i + 1));
  });

  if (rest.length > 0) {
    rest.forEach(function(r, i) {
      allList.appendChild(buildBarRow(r, i + 11));
    });
  } else {
    allList.innerHTML = '<div class="no-results" style="padding:20px">All results shown in Top 10 above.</div>';
  }
}

function buildLegend() {
  var legend = document.getElementById('legend');
  var cats = Object.keys(CAT_COLORS);
  cats.forEach(function(cat) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<span class="legend-dot" style="background:' + CAT_COLORS[cat] + '"></span>' + CAT_LABELS[cat];
    legend.appendChild(item);
  });
}

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) {
      b.style.background = '#fff';
      b.style.color = '#333';
      b.classList.remove('active');
    });
    var cat = btn.getAttribute('data-cat');
    if (cat === 'all') {
      btn.style.background = '#444';
      btn.style.color = '#fff';
    } else {
      btn.style.background = CAT_COLORS[cat];
      btn.style.color = '#fff';
    }
    btn.classList.add('active');
    activeFilter = cat;
    render();
  });
});

document.getElementById('search').addEventListener('input', function(e) {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

buildLegend();
render();
</script>
